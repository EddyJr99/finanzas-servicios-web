# Configuracion de los servicios web REST del proyecto SGFP.
spring.application.name=finanzas-servicios-web

# Puerto del servidor (tambien se puede cambiar con la variable de entorno SERVER_PORT).
server.port=8080

# Conexion a la base de datos MySQL "sgfp".
# Laragon y XAMPP traen por defecto: usuario root, sin clave, puerto 3306.
# Si su MySQL es distinto, cambie estos valores o defina las variables de entorno
# SGFP_DB_URL, SGFP_DB_USER y SGFP_DB_PASSWORD.
spring.datasource.url=${SGFP_DB_URL:jdbc:mysql://localhost:3306/sgfp?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota}
spring.datasource.username=${SGFP_DB_USER:root}
spring.datasource.password=${SGFP_DB_PASSWORD:}

# Si el cuerpo JSON trae un campo que la API no conoce, se rechaza con 400
# (ayuda a detectar errores de escritura en los nombres de los campos).
spring.jackson.deserialization.fail-on-unknown-properties=true
# Las fechas se escriben como texto AAAA-MM-DD y no como arreglos de numeros.
spring.jackson.serialization.write-dates-as-timestamps=false

# Mensajes de consola mas limpios.
spring.main.banner-mode=off

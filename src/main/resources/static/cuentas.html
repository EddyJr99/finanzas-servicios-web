<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cuentas y categorías — SGFP</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div class="mobile-topbar">
  <div class="auth-brand" style="font-size:0.98rem;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="3" y="3" width="18" height="18" rx="4" stroke="#C99A2E" stroke-width="1.6"/><path d="M7.5 14.5 10.5 11l2.3 2.3L16.5 9" stroke="#C99A2E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg> SGFP</div>
  <button id="menu-toggle" aria-expanded="false" aria-label="Abrir menú">☰ Menú</button>
</div>

<div class="app-shell">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="3" y="3" width="18" height="18" rx="4" stroke="#C99A2E" stroke-width="1.6"/><path d="M7.5 14.5 10.5 11l2.3 2.3L16.5 9" stroke="#C99A2E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg> SGFP</div>
    <ul class="side-nav">
      <li><a href="dashboard.html"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 12h4l3 8 4-16 3 8h4"/></svg>Movimientos</a></li>
      <li><a href="cuentas.html" class="active"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/></svg>Cuentas y categorías</a></li>
      <li><a href="#" class="nav-disabled"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3v18M5 8h9a3 3 0 0 1 0 6H8a3 3 0 0 0 0 6h9"/></svg>Presupuestos<span class="soon">pronto</span></a></li>
      <li><a href="api.html" class="ext"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 7 3 12l5 5M16 7l5 5-5 5"/></svg>Documentación API</a></li>
    </ul>
    <div class="sidebar-footer">
      <div class="user-chip">
        <div class="user-avatar" id="user-avatar">--</div>
        <div>
          <div class="name" id="user-name"></div>
          <div class="role" id="user-mail"></div>
        </div>
      </div>
      <a href="index.html" class="logout-link" id="logout">Cerrar sesión →</a>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div>
        <h1>Cuentas y categorías</h1>
        <p class="sub">Configura dónde está tu dinero y cómo clasificas tus movimientos.</p>
      </div>
    </div>

    <div class="cards-3">
      <section class="panel">
        <div class="panel-header"><h2>Mis cuentas</h2></div>
        <table class="moves">
          <thead><tr><th>Cuenta</th><th>Tipo</th><th>Banco</th><th></th></tr></thead>
          <tbody id="cuentas-tbody"></tbody>
        </table>
        <form class="mini-form" id="cuenta-form" novalidate>
          <div class="field"><label for="cta-nombre">Nombre</label><input id="cta-nombre" maxlength="100" placeholder="Ej. Ahorros BBVA"></div>
          <div class="field"><label for="cta-tipo">Tipo</label>
            <select id="cta-tipo"><option>Ahorros</option><option>Corriente</option><option>Nómina</option><option>Efectivo</option><option>Tarjeta de crédito</option></select></div>
          <div class="field"><label for="cta-banco">Banco</label><input id="cta-banco" maxlength="100" placeholder="Ej. BBVA"></div>
          <button class="btn-add" type="submit">Agregar</button>
        </form>
        <div class="panel-msg" id="cuenta-msg"></div>
      </section>

      <section class="panel">
        <div class="panel-header"><h2>Categorías</h2></div>
        <table class="moves">
          <thead><tr><th>Categoría</th><th>Tipo</th><th></th></tr></thead>
          <tbody id="categorias-tbody"></tbody>
        </table>
        <form class="mini-form" id="categoria-form" novalidate>
          <div class="field"><label for="cat-nombre">Nombre</label><input id="cat-nombre" maxlength="100" placeholder="Ej. Salario"></div>
          <div class="field"><label for="cat-tipo">Tipo</label>
            <select id="cat-tipo"><option value="GASTO">Gasto</option><option value="INGRESO">Ingreso</option></select></div>
          <button class="btn-add" type="submit">Agregar</button>
        </form>
        <div class="panel-msg" id="categoria-msg"></div>
      </section>

      <section class="panel">
        <div class="panel-header"><h2>Medios de pago</h2></div>
        <table class="moves">
          <thead><tr><th>Medio</th><th>Entidad</th></tr></thead>
          <tbody id="medios-tbody"></tbody>
        </table>
        <form class="mini-form" id="medio-form" novalidate>
          <div class="field"><label for="med-nombre">Nombre</label><input id="med-nombre" maxlength="100" placeholder="Ej. Nequi"></div>
          <div class="field"><label for="med-entidad">Entidad</label><input id="med-entidad" maxlength="100" placeholder="Ej. Bancolombia"></div>
          <button class="btn-add" type="submit">Agregar</button>
        </form>
        <div class="panel-msg" id="medio-msg"></div>
      </section>
    </div>
  </main>
</div>

<script src="js/api.js"></script>
<script src="js/cuentas.js"></script>
</body>
</html>

# Perfil "demo": se activa en Render (ver Dockerfile).
# Usa una base H2 en memoria en modo MySQL con datos de ejemplo, porque Render no
# ofrece MySQL y la base de Laragon solo existe en el equipo local.
spring.datasource.url=jdbc:h2:mem:sgfp;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:demo/schema.sql
spring.sql.init.data-locations=classpath:demo/data.sql
spring.sql.init.encoding=UTF-8
